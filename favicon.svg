<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente neón morado a cian -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Resplandor sutil -->
    <filter id="cartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#cartGlow)">
    <!-- Estructura del Carrito -->
    <path 
      d="M80 110 h60 l45 190 h215 l40 -140 h-280" 
      fill="none" 
      stroke="url(#neonGrad)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Rejilla interna del carrito -->
    <line x1="220" y1="210" x2="390" y2="210" stroke="#06b6d4" stroke-width="20" stroke-linecap="round" />
    <line x1="280" y1="160" x2="280" y2="280" stroke="#a855f7" stroke-width="20" stroke-linecap="round" />
    <line x1="340" y1="160" x2="340" y2="280" stroke="#a855f7" stroke-width="20" stroke-linecap="round" />

    <!-- Ruedas neón -->
    <circle cx="210" cy="380" r="32" fill="#06b6d4" />
    <circle cx="210" cy="380" r="14" fill="#ffffff" />

    <circle cx="370" cy="380" r="32" fill="#a855f7" />
    <circle cx="370" cy="380" r="14" fill="#ffffff" />
  </g>
</svg>
