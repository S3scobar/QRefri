<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRefri</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>⚡ QRefri</h1>
            <p class="subtitle">Gestor de Nevera, Despensa & Aseo</p>
        </header>

        <!-- Acceso Rápido -->
        <div class="quick-add">
            <span class="section-label">Acceso Rápido</span>
            <div class="quick-chips">
                <button class="chip" data-name="Leche 🥛" data-category="Nevera">🥛 Leche</button>
                <button class="chip" data-name="Huevos 🥚" data-category="Nevera">🥚 Huevos</button>
                <button class="chip" data-name="Pan 🍞" data-category="Despensa">🍞 Pan</button>
                <button class="chip" data-name="Café ☕" data-category="Despensa">☕ Café</button>
                <button class="chip" data-name="Jabón 🧼" data-category="Aseo">🧼 Jabón</button>
            </div>
        </div>

        <!-- Formulario (Un solo selector de categoría) -->
        <form id="add-form" class="add-box">
            <input type="text" id="item-input" placeholder="¿Qué necesitas comprar u ordenar?" required autocomplete="off">
            
            <select id="category-select" required>
                <option value="Nevera" selected>❄️ Nevera</option>
                <option value="Despensa">🥫 Despensa</option>
                <option value="Aseo">🧹 Aseo</option>
            </select>

            <button type="button" id="submit-btn" onclick="agregarProducto()">Añadir a la Lista</button>
        </form>

        <!-- Barra de Búsqueda -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Buscar elemento...">
        </div>

        <!-- Filtros Rápidos -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="Nevera">❄️ Nevera</button>
            <button class="filter-btn" data-filter="Despensa">🥫 Despensa</button>
            <button class="filter-btn" data-filter="Aseo">🧹 Aseo</button>
        </div>

        <!-- Listas -->
        <main class="lists-container">
            <!-- Por Comprar -->
            <section class="list-card">
                <div class="list-header">
                    <h2>🛒 Por Comprar <span id="shopping-count" class="count-badge">0</span></h2>
                </div>
                <ul id="shopping-list" class="item-list"></ul>
            </section>

            <!-- En Casa -->
            <section class="list-card">
                <div class="list-header">
                    <h2>📦 En Casa <span id="fridge-count" class="count-badge">0</span></h2>
                </div>
                <ul id="fridge-list" class="item-list"></ul>
            </section>
        </main>
    </div>

    <!-- Notificaciones Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
